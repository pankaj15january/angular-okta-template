<div class="form-container">
    <form [formGroup]="emailForm" (ngSubmit)="onSubmit()" enctype="multipart/form-data">
        <input formControlName="to" type="email" placeholder="To">
        <input formControlName="subject" type="text" placeholder="Subject">
        <textarea formControlName="body" placeholder="Body"></textarea>
        <input formControlName="attachment" type="file" (change)="onFileChange($event)">
        <button type="submit">Send</button>
    </form>
</div>
