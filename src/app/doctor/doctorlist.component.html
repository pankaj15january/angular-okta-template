  <!-- Mattable part started -->
  <div class="table-container">
    <mat-form-field appearance="outline">
      <mat-label>Filter</mat-label>
      <input matInput (keyup)="applyFilter($event)" placeholder="Search">
    </mat-form-field>
  
    <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8">
      
      <!-- First Name Column -->
      <ng-container matColumnDef="doctorId">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Doctor Id</th>
        <td mat-cell *matCellDef="let element">{{ element.doctorId }}</td>
      </ng-container>
  
      <!-- Last Name Column -->
      <ng-container matColumnDef="firstName">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>First Name</th>
        <td mat-cell *matCellDef="let element">{{ element.firstName }}</td>
      </ng-container>
  
      <!-- Last Age Column -->
      <ng-container matColumnDef="lastName">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Last Name</th>
        <td mat-cell *matCellDef="let element">{{ element.lastName }}</td>
      </ng-container>
  
      <!-- Last Email Column -->
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Email</th>
        <td mat-cell *matCellDef="let element">{{ element.email }}</td>
      </ng-container>
  
      <!-- Phone Column -->
      <ng-container matColumnDef="phone">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Phone</th>
        <td mat-cell *matCellDef="let element">{{ element.phone }}</td>
      </ng-container>
  
      <!-- Specialization number Column -->
      <ng-container matColumnDef="specialization">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Specialization</th>
        <td mat-cell *matCellDef="let element">{{ element.specialization }}</td>
      </ng-container>
  
      
      <!-- AvailableDate Column -->
      <ng-container matColumnDef="availableDate">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>availableDate</th>
        <td mat-cell *matCellDef="let element">{{ element.availableDate }}</td>
      </ng-container>
  
      
      <!-- Message Column -->
      <ng-container matColumnDef="message">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>message</th>
        <td mat-cell *matCellDef="let element">{{ element.message }}</td>
      </ng-container>  
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  
    <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
  </div>
