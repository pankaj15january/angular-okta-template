<div class="form-container">
  <form [formGroup]="doctorForm" (ngSubmit)="onSubmit()">
    <label for="name">Name</label>
    <input id="name" formControlName="name" type="text" placeholder="Enter full name" />
    <div *ngIf="doctorForm.get('name')?.invalid && doctorForm.get('name')?.touched">
      Name is required (Min: 3 characters).
    </div>

    <label for="email">Email</label>
    <input id="email" formControlName="email" type="email" placeholder="Enter email" />
    <div *ngIf="doctorForm.get('email')?.invalid && doctorForm.get('email')?.touched">
      Enter a valid email.
    </div>

    <label for="phone">Phone</label>
    <input id="phone" formControlName="phone" type="text" placeholder="Enter phone number" />
    <div *ngIf="doctorForm.get('phone')?.invalid && doctorForm.get('phone')?.touched">
      Enter a valid phone number.
    </div>

    <label for="specialization">Specialization</label>
    <select id="specialization" formControlName="specialization">
      <option value="">Select Specialization</option>
      <option value="cardiologist">Cardiologist</option>
      <option value="neurologist">Neurologist</option>
      <option value="pediatrician">Pediatrician</option>
    </select>
    <div *ngIf="doctorForm.get('specialization')?.invalid && doctorForm.get('specialization')?.touched">
      Specialization is required.
    </div>

    <label for="availableDate">Available Date</label>
    <input id="availableDate" formControlName="availableDate" type="date" />
    <div *ngIf="doctorForm.get('availableDate')?.invalid && doctorForm.get('availableDate')?.touched">
      Select an available date.
    </div>

    <label for="message">Message</label>
    <textarea id="message" formControlName="message" rows="3" placeholder="Additional message (optional)"></textarea>

    <button type="submit" [disabled]="doctorForm.invalid">Submit</button>
  </form>
</div>
